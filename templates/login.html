<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DSSP Dashboard — Sign In</title>

  <!-- Same fonts as main dashboard -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />

  <style>
    /* ── EXACT same design tokens as style.css ── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:          #07090f;
      --glass:       rgba(255,255,255,0.04);
      --glass-b:     rgba(255,255,255,0.08);
      --text:        #e8eaf0;
      --text-muted:  #6b7280;
      --text-dim:    #9ca3af;
      --accent:      #6366f1;
      --accent-glow: rgba(99,102,241,0.4);
      --accent2:     #8b5cf6;
      --red:         #ef4444;
      --red-dim:     rgba(239,68,68,0.15);
      --border:      rgba(255,255,255,0.07);
      --radius:      14px;
      --radius-sm:   8px;
      --font:        'Inter', system-ui, sans-serif;
      --mono:        'JetBrains Mono', monospace;
      --shadow:      0 8px 32px rgba(0,0,0,0.5);
    }

    html, body {
      min-height: 100%;
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      font-size: 14px;
      line-height: 1.6;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    /* ── Same animated background orbs as main dashboard ── */
    .bg-orb {
      position: fixed;
      border-radius: 50%;
      filter: blur(80px);
      pointer-events: none;
      z-index: 0;
      animation: drift 20s ease-in-out infinite alternate;
    }
    .orb-1 { width: 500px; height: 500px; background: rgba(99,102,241,0.12); top: -100px; left: -100px; animation-delay: 0s; }
    .orb-2 { width: 400px; height: 400px; background: rgba(139,92,246,0.08); bottom: -50px; right: -100px; animation-delay: -7s; }
    .orb-3 { width: 300px; height: 300px; background: rgba(59,130,246,0.07); top: 40%; left: 45%; animation-delay: -14s; }
    @keyframes drift {
      from { transform: translate(0,0) scale(1); }
      to   { transform: translate(30px,20px) scale(1.05); }
    }

    /* ── Card ── */
    .login-wrap {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 400px;
      margin: 1.5rem;
      animation: slideUp 0.3s ease;
    }
    @keyframes slideUp {
      from { transform: translateY(20px); opacity: 0; }
      to   { transform: none; opacity: 1; }
    }

    .login-card {
      background: var(--glass);
      border: 1px solid var(--border);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border-radius: var(--radius);
      padding: 2.5rem 2rem;
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      gap: 0;
    }

    /* ── Logo — identical to dashboard header logo ── */
    .logo {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 2rem;
    }
    .logo-icon {
      width: 44px; height: 44px;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      display: flex; align-items: center; justify-content: center;
      font-size: 20px;
      box-shadow: 0 0 20px var(--accent-glow);
      flex-shrink: 0;
    }
    .logo-title { font-size: 18px; font-weight: 700; letter-spacing: -0.3px; }
    .logo-sub   { font-size: 11px; color: var(--text-muted); margin-top: 1px; }

    /* ── Heading ── */
    h1 {
      font-size: 1.35rem;
      font-weight: 700;
      color: var(--text);
      letter-spacing: -0.3px;
      margin-bottom: 0.3rem;
    }
    .subtitle {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-bottom: 1.8rem;
    }

    /* ── Error banner ── */
    .error-banner {
      background: var(--red-dim);
      border: 1px solid rgba(239,68,68,0.3);
      border-radius: var(--radius-sm);
      padding: 0.65rem 1rem;
      color: #fca5a5;
      font-size: 0.8rem;
      margin-bottom: 1.2rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    /* ── Form ── */
    .form-group { margin-bottom: 1rem; }

    label {
      display: block;
      font-size: 0.72rem;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 0.4rem;
    }

    .input-wrap {
      position: relative;
      display: flex;
      align-items: center;
    }
    .input-icon {
      position: absolute;
      left: 11px;
      font-size: 13px;
      opacity: 0.45;
      pointer-events: none;
    }

    input[type="text"],
    input[type="password"] {
      width: 100%;
      padding: 0.72rem 1rem 0.72rem 2.2rem;
      background: rgba(255,255,255,0.05);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      color: var(--text);
      font-size: 0.88rem;
      font-family: var(--font);
      outline: none;
      transition: border-color .2s, background .2s, box-shadow .2s;
    }
    input[type="text"]:focus,
    input[type="password"]:focus {
      border-color: rgba(99,102,241,0.55);
      background: rgba(99,102,241,0.06);
      box-shadow: 0 0 0 3px rgba(99,102,241,0.12);
    }
    input::placeholder { color: rgba(255,255,255,0.2); }

    /* password toggle */
    .pw-toggle {
      position: absolute;
      right: 11px;
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 13px;
      padding: 2px 4px;
      line-height: 1;
      transition: color .2s;
    }
    .pw-toggle:hover { color: var(--text); }

    /* ── Submit button — same style as .btn-primary ── */
    .btn-login {
      width: 100%;
      padding: 0.78rem;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      color: #fff;
      border: none;
      border-radius: var(--radius-sm);
      font-size: 0.9rem;
      font-weight: 600;
      font-family: var(--font);
      cursor: pointer;
      margin-top: 0.6rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      letter-spacing: 0.01em;
      box-shadow: 0 4px 20px var(--accent-glow);
      transition: opacity .2s, transform .15s, box-shadow .2s;
      position: relative;
      overflow: hidden;
    }
    .btn-login::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(255,255,255,0.08), transparent);
      opacity: 0;
      transition: opacity .2s;
    }
    .btn-login:hover::before { opacity: 1; }
    .btn-login:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 30px var(--accent-glow);
    }
    .btn-login:active { transform: translateY(0); }

    /* ── Divider ── */
    .divider {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 1.4rem 0 0;
      color: var(--text-muted);
      font-size: 0.72rem;
    }
    .divider::before, .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border);
    }

    /* ── Footer ── */
    .login-footer {
      margin-top: 1.2rem;
      text-align: center;
      font-size: 0.7rem;
      color: rgba(255,255,255,0.18);
      font-family: var(--mono);
    }

    /* ── Scrollbar (match dashboard) ── */
    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 99px; }
  </style>
</head>
<body>

  <!-- Background orbs (same as main dashboard) -->
  <div class="bg-orb orb-1"></div>
  <div class="bg-orb orb-2"></div>
  <div class="bg-orb orb-3"></div>

  <div class="login-wrap">
    <div class="login-card">

      <!-- Logo — identical to dashboard header -->
      <div class="logo">
        <div class="logo-icon">🛡️</div>
        <div>
          <div class="logo-title">DSSP Dashboard</div>
          <div class="logo-sub">FRSC Session Automation</div>
        </div>
      </div>

      <h1>Welcome back</h1>
      <p class="subtitle">Sign in to access the automation dashboard.</p>

      <!-- Flash messages -->
      {% with messages = get_flashed_messages(with_categories=true) %}
        {% for category, message in messages %}
          <div class="error-banner">⚠ {{ message }}</div>
        {% endfor %}
      {% endwith %}

      <!-- Login form -->
      <form method="POST" action="{{ url_for('login_page') }}" autocomplete="on">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />

        <div class="form-group">
          <label for="username">Username</label>
          <div class="input-wrap">
            <span class="input-icon">👤</span>
            <input
              type="text"
              id="username"
              name="username"
              placeholder="Enter username"
              autocomplete="username"
              required
            />
          </div>
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <div class="input-wrap">
            <span class="input-icon">🔑</span>
            <input
              type="password"
              id="password"
              name="password"
              placeholder="Enter password"
              autocomplete="current-password"
              required
            />
            <button type="button" class="pw-toggle" onclick="togglePw()" title="Show / hide password" aria-label="Toggle password visibility">👁</button>
          </div>
        </div>

        <button type="submit" class="btn-login">
          <span>Sign In</span>
          <span>→</span>
        </button>
      </form>

      <div class="divider">secured with bcrypt + csrf</div>

    </div>
  </div>

  <script>
    function togglePw() {
      const el = document.getElementById('password');
      const btn = document.querySelector('.pw-toggle');
      if (el.type === 'password') {
        el.type = 'text';
        btn.textContent = '🙈';
      } else {
        el.type = 'password';
        btn.textContent = '👁';
      }
    }
  </script>
</body>
</html>
